], "headline-lg-mobile": ["22px", { "lineHeight": "30px", "letterSpacing": "0px", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "500" }], "display-lg": ["40px", { "lineHeight": "52px", "letterSpacing": "0px", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "38px", "letterSpacing": "0px", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">
<!-- Subtle Ambient Glow -->
<div class="relative w-full max-w-sm mx-auto flex flex-col items-center">
<!-- Header & Brand Plinth -->
<div class="flex flex-col items-center text-center mt-space-lg mb-space-lg">
<div class="relative w-20 h-20 bg-surface-container-lowest shadow-md rounded-xl p-space-xs flex items-center justify-center mb-space-md">
<img alt="شعار أروقة دار ديزاين" class="w-full h-full object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/AEtjO1VH3vghTFcADuuueH0BsTcOKFD0qtePj9DVMNgQbPNZV3ion7mFY9I7-BQSwOLLVtSUifmLkpwWn0LnUzJgLTwJYBw8Oey_e1QOa961Zsh2Nq_O2jBuGiRfVYAyKB9a8SkYddIyuObSRTnQFHYeGI7lmmEJkNT-P6R3ftlC9RZ0qIVR_V3XACG1OtjXxqQRasYtQFFu3-Ad6dtjjcl07aaGPgJyfe5C8HlQkeg_Hi-kKL-EGewww4_ZCg">
<div class="absolute -bottom-1 -left-1 w-5 h-5 bg-secondary text-on-secondary rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[12px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-space-xs tracking-tight">
        أروقة دار ديزاين
      </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        فضاء التسيير والإدارة | لوحة التحكم
      </p>
<!-- Security Pill -->

</div>
<!-- Login Architectural Plane (Form Card) -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-space-lg flex flex-col gap-space-md">
<!-- System Notification / Quick Ping -->

<form class="flex flex-col gap-space-md" id="adminLoginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Username Field -->
<div class="flex flex-col gap-space-xs text-right">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="usernameInput">
<span class="">اسم المستخدم (Username)</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">معرّف الفريق</span>
</label>
<div class="relative flex items-center">
<span class="absolute right-3.5 text-on-surface-variant pointer-events-none flex items-center">
<span class="material-symbols-outlined text-[20px]">badge</span>
</span>
<input autocomplete="username" class="w-full h-12 pr-11 pl-4 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg shadow-sm placeholder:text-outline-variant focus:outline-none focus:bg-surface-container-low transition-colors" id="usernameInput" placeholder="مثال: amine_admin أو confirmateur_dz" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs text-right">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="passwordInput">
<span class="">كلمة المرور (Password)</span>
<button class="font-label-sm text-label-sm text-primary-container hover:underline focus:outline-none" type="button">
              نسيت كلمة المرور؟
            </button>
</label>
<div class="relative flex items-center">
<span class="absolute right-3.5 text-on-surface-variant pointer-events-none flex items-center">
<span class="material-symbols-outlined text-[20px]">key</span>
</span>
<input autocomplete="current-password" class="w-full h-12 pr-11 pl-11 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg shadow-sm placeholder:text-outline-variant focus:outline-none focus:bg-surface-container-low transition-colors" id="passwordInput" placeholder="••••••••••••" required="" type="password">
<button aria-label="إظهار أو إخفاء كلمة المرور" class="absolute left-3.5 text-on-surface-variant hover:text-on-surface flex items-center focus:outline-none" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Session Persistence -->
<div class="flex items-center justify-between py-space-xs">
<label class="flex items-center gap-space-xs cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded bg-surface-container text-primary-container accent-primary-container cursor-pointer focus:ring-0" id="rememberDevice" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface">تذكر جلسة العمل (14 يوماً)</span>
</label>
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">shield</span>
            جلسة مشفرة
          </span>
</div>
<!-- Primary Action Button -->
<button class="relative w-full h-12 bg-primary-container hover:bg-primary active:bg-primary text-on-primary font-title-md text-title-md rounded-lg shadow-md flex items-center justify-center gap-space-sm transition-all duration-200 mt-space-xs" id="submitBtn" type="submit">
<span id="btnText" class="">تسجيل الدخول إلى النظام</span>
<span class="material-symbols-outlined text-[20px]" id="btnIcon">arrow_back</span>
</button>
</form>
<!-- Contextual Role Badges -->

</div>
<!-- Quick Help & Support Trigger -->

<!-- Security Footer Note -->

</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    if (!passwordInput || !eyeIcon) return;

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const username = document.getElementById('usernameInput').value;

    if (!btn || !btnText || !btnIcon) return;

    btnText.textContent = 'جاري التحقق والمصادقة...';
    btnIcon.textContent = 'hourglass_top';
    btn.classList.add('opacity-90', 'cursor-wait');

    setTimeout(() => {
      btnText.textContent = 'تم تسجيل الدخول بنجاح';
      btnIcon.textContent = 'check_circle';
      btn.classList.remove('bg-primary-container', 'hover:bg-primary');
      btn.classList.add('bg-secondary', 'text-on-secondary');
    }, 900);
  }
</script></main>

</body></html>
